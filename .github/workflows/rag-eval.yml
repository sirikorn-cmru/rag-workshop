name: rag-eval
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Baseline (tfidf)
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9
      - name: Hybrid
        run: python -m rag.evaluate --split dev --method hybrid -k 4 --min-hit 0.9
      - run: pytest -q -m w4 -o addopts=""
